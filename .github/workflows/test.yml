name: Passmark AI Browser Regression Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Passmark AI Tests & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Redis service container for Passmark step caching
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify Redis Cache Service
        run: |
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping
          echo "Redis service container running on port 6379"

      - name: Strict TypeScript Compilation
        run: npm run build

      - name: Execute Passmark AI Test Suite
        env:
          CI: true
          REDIS_URL: redis://localhost:6379
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ] || [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "🚀 Running Passmark AI browser tests..."
            npx playwright test
          else
            echo "=========================================================="
            echo "ℹ️  AI API Keys not yet populated in GitHub Repository Secrets."
            echo "✅ Strict TypeScript type-check passed cleanly with 0 errors."
            echo "✅ Redis 7 Alpine cache service container pinged successfully."
            echo "👉 To trigger live browser agent runs in CI, add:"
            echo "   GOOGLE_GENERATIVE_AI_API_KEY or ANTHROPIC_API_KEY"
            echo "   under Repo Settings -> Secrets and variables -> Actions."
            echo "=========================================================="
          fi

      - name: Upload Playwright Test Report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
